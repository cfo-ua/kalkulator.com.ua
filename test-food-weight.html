<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Weight Calculator - Test</title>
    <style>
        /* Import the actual CSS from the site */
        * { box-sizing: border-box; }
        html, body { max-width: 100vw; overflow-x: hidden; }
        
        :root {
          --main-color: #181818;
          --accent: #157aff;
          --accent-hover: #0056d6;
          --bg: #fff;
          --card-bg: #f7f8fa;
          --border: #e5e5e5;
          --radius: 18px;
          --shadow: 0 4px 24px 0 rgba(60, 60, 60, 0.04);
          --nav-height: 64px;
          --transition: 0.16s cubic-bezier(.37,.01,.69,1.53);
        }
        
        body {
          margin: 0;
          color: var(--main-color);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          min-height: 100vh;
          background: var(--bg);
          padding: 20px;
          max-width: 800px;
          margin: 0 auto;
        }
        
        /* Food calculator styles from the CSS */
        .calculator-section {
          margin: 2em 0;
        }
        
        .food-row-card {
          background: #fff;
          border-radius: 20px;
          box-shadow: 0 1px 8px 0 rgba(60,60,60,0.07);
          margin-bottom: 1.1em;
          overflow: visible;
          position: relative;
          min-width: 0;
        }
        
        .food-row-grid {
          display: flex;
          align-items: stretch;
          min-height: 50px;
          min-width: 0;
          position: relative;
          gap: 0;
        }
        
        .food-row-input-wrap {
          position: relative;
          flex: 3 1 0;
          min-width: 130px;
          max-width: 400px;
          display: flex;
          align-items: stretch;
        }
        
        .food-row-input-wrap input[type="text"] {
          width: 100%;
          background: #f7f8fa;
          color: #181818;
          padding: 0.84em 1.15em;
          font-size: 1.13em;
          border: none;
          margin: 0;
          outline: none;
          border-radius: 0;
          border-top-left-radius: 16px;
          border-bottom-left-radius: 16px;
          font-weight: 500;
          transition: background 0.17s, color 0.15s;
        }
        
        .food-qty {
          flex: 1.1 1 0;
          min-width: 58px;
          max-width: 130px;
          background: #f7f8fa;
          color: #181818;
          padding: 0.84em 0.8em 0.84em 0.8em;
          font-size: 1.13em;
          border: none;
          margin: 0;
          outline: none;
          border-radius: 0;
          text-align: right;
          font-variant-numeric: tabular-nums;
          font-weight: 500;
        }
        
        .food-weight {
          flex: 1.5 1 0;
          background: #f7f8fa;
          color: #28a745;
          padding: 0.84em 1em;
          font-size: 1.13em;
          border: none;
          margin: 0;
          outline: none;
          border-radius: 0;
          text-align: right;
          font-weight: 600;
          display: flex;
          align-items: center;
          justify-content: flex-end;
        }
        
        .remove-food-btn {
          border: none;
          background: #f7f8fa;
          color: #c00;
          font-size: 1.45em;
          width: 48px;
          min-width: 48px;
          height: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          border-top-right-radius: 16px;
          border-bottom-right-radius: 16px;
          padding: 0;
        }
        
        .calculator-controls {
          margin: 20px 0;
          display: flex;
          gap: 15px;
          flex-wrap: wrap;
        }
        
        .secondary-btn, .primary-btn {
          padding: 12px 24px;
          border-radius: 12px;
          border: none;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }
        
        .secondary-btn {
          background: #f0f0f0;
          color: #333;
        }
        
        .primary-btn {
          background: var(--accent);
          color: white;
        }
        
        .result {
          margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Food Weight Calculator by Quantity</h1>
    
    <div class="calculator-section">
        <div id="weight-rows">
            <!-- Initial weight row for testing -->
            <div class="food-row-card">
                <div class="food-row-grid" data-row="1">
                    <div class="food-row-input-wrap">
                        <input type="text" class="food-name" id="weight-name-1" placeholder="Enter food name (e.g., apple, banana)" autocomplete="off" value="Apple">
                    </div>
                    <input type="number" class="food-qty" id="weight-qty-1" min="1" step="1" value="3" placeholder="Quantity">
                    <span class="food-weight" id="weight-result-1"><strong>540g</strong><br><small>(19.0 oz, 1.19 lbs)</small></span>
                    <button type="button" class="remove-food-btn" title="Remove this item">✕</button>
                </div>
            </div>
            
            <div class="food-row-card">
                <div class="food-row-grid" data-row="2">
                    <div class="food-row-input-wrap">
                        <input type="text" class="food-name" id="weight-name-2" placeholder="Enter food name (e.g., apple, banana)" autocomplete="off" value="Banana">
                    </div>
                    <input type="number" class="food-qty" id="weight-qty-2" min="1" step="1" value="2" placeholder="Quantity">
                    <span class="food-weight" id="weight-result-2"><strong>240g</strong><br><small>(8.5 oz, 0.53 lbs)</small></span>
                    <button type="button" class="remove-food-btn" title="Remove this item">✕</button>
                </div>
            </div>
        </div>
        
        <div class="calculator-controls">
            <button type="button" id="weight-add-row" class="secondary-btn">+ Add Another Food</button>
        </div>
    </div>
    
    <div id="food-weight-result" class="result">
        <!-- Sample result for testing -->
        <div style="background:#f8f9fa;padding:20px;border-radius:8px;margin:20px 0;">
            <h3 style="color:#157aff;margin-top:0;">Weight Calculation Results</h3>
            
            <div style="background:#e8f5e8;padding:20px;border-radius:6px;text-align:center;margin:15px 0;">
                <h4 style="margin:0;color:#2e7d32;">Total Weight</h4>
                <div style="font-size:2.5em;font-weight:bold;color:#1b5e20;margin:10px 0;">
                    780g
                </div>
                <div style="font-size:1.2em;color:#388e3c;">
                    27.5 ounces • 1.72 pounds
                </div>
                <div style="color:#666;margin-top:10px;">
                    2 items calculated
                </div>
            </div>
            
            <div style="background:white;padding:20px;border-radius:6px;">
                <h4 style="margin-top:0;">Item Breakdown</h4>
                <div style="overflow-x:auto;">
                    <table style="width:100%;border-collapse:collapse;font-size:0.9em;">
                        <thead>
                            <tr style="background:#f5f5f5;">
                                <th style="padding:12px;text-align:left;border-bottom:2px solid #ddd;">Food Item</th>
                                <th style="padding:12px;text-align:center;border-bottom:2px solid #ddd;">Quantity</th>
                                <th style="padding:12px;text-align:center;border-bottom:2px solid #ddd;">Weight Each</th>
                                <th style="padding:12px;text-align:center;border-bottom:2px solid #ddd;">Total (g)</th>
                                <th style="padding:12px;text-align:center;border-bottom:2px solid #ddd;">Total (oz)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>Apple</strong></td>
                                <td style="text-align:center;">3</td>
                                <td style="text-align:center;">180g</td>
                                <td style="text-align:center;"><strong>540g</strong></td>
                                <td style="text-align:center;">19.0 oz</td>
                            </tr>
                            <tr>
                                <td><strong>Banana</strong></td>
                                <td style="text-align:center;">2</td>
                                <td style="text-align:center;">120g</td>
                                <td style="text-align:center;"><strong>240g</strong></td>
                                <td style="text-align:center;">8.5 oz</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
