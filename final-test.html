<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Calories Calculator - Final Test</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <h1>Food Calories Calculator</h1>
        
        <div class="calculator-section">
            <div id="food-rows">
                <!-- This will be populated by JavaScript -->
            </div>
            
            <div class="calculator-controls">
                <button type="button" id="add-food-btn" class="secondary-btn">+ Add Another Ingredient</button>
                <button type="button" id="calculate-food-btn" class="primary-btn">Calculate Nutrition</button>
            </div>
        </div>
        
        <div id="food-result" class="result"></div>
    </div>
    
    <script src="/en/js/food-calories.js"></script>
</body>
</html>
