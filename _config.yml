title: "kalkulator.com.ua"
description: "Онлайн калькулятори для України"
baseurl: "" # Required for GitHub Pages
url: "https://kalkulator.com.ua"
exclude: 
  - README.md
  - SEARCH_SYSTEM.md
  - SCHEMA_ORG_IMPLEMENTATION.md
  - SITEMAP_*.md
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata

# Sitemap configuration to prevent script injection
sitemap:
  exclude:
    - "/404.html"
    - "/ads.txt"
  file: "/sitemap.xml"

# Collections configuration
collections:
  calculators:
    output: true
    permalink: /:collection/:name/

# Markdown processor
markdown: kramdown

# Security: Explicitly disable any plugins that might modify XML output
# Note: Using custom sitemap.xml template instead of jekyll-sitemap plugin
# to prevent potential script injection issues
plugins: []
  # - jekyll-sitemap  # Disabled - using custom sitemap.xml to prevent script injection

# Set timezone for proper date handling
timezone: Europe/Kiev

# Defaults for SEO and layouts (optional, improves DRYness)
defaults:
  - scope:
      path: ""
      type: calculators
    values:
      layout: calculator
      seo:
        keywords: ["калькулятор", "онлайн калькулятор", "україна"]
  - scope:
      path: "en/calculators"
      type: pages
    values:
      layout: calculator
      permalink: /en/calculators/:basename/

# (Optional) Configuration for Markdown rendering
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
