<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        
        :root {
            --accent: #157aff;
            --accent-hover: #0d5cb8;
            --card-bg: white;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        .coin-flip-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            padding: 2rem;
        }

        .coin-wrapper {
            perspective: 1000px;
            margin: 2rem 0;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coin {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2s ease-in-out;
            cursor: pointer;
        }

        .coin-side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 4px solid #ffd700;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,215,0,0.3);
            backface-visibility: hidden;
        }

        .heads {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #8b4513;
            transform: rotateY(0deg);
        }

        .tails {
            background: linear-gradient(45deg, #c0c0c0, #e8e8e8);
            color: #2c2c2c;
            transform: rotateY(180deg);
        }

        .coin-text {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .flip-button {
            background: linear-gradient(45deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 2rem auto;
            box-shadow: var(--shadow);
        }

        .flip-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(21, 122, 255, 0.3);
        }

        .flip-button:active {
            transform: translateY(0);
        }

        .flip-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 2px solid transparent;
            transition: all var(--transition);
        }

        .result.heads {
            border-color: #ffd700;
            background: linear-gradient(45deg, #fff9e6, #fffacd);
        }

        .result.tails {
            border-color: #c0c0c0;
            background: linear-gradient(45deg, #f8f8f8, #f0f0f0);
        }

        .result p {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: var(--radius);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .reset-section {
            margin-top: 1.5rem;
            text-align: center;
        }

        .reset-button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
        }

        .reset-button:hover {
            background: #ff3742;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .reset-icon {
            font-size: 1rem;
        }

        /* Animation classes */
        .coin.flipping {
            animation: flip 2s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            25% { transform: rotateY(450deg) rotateX(180deg) translateY(-50px); }
            50% { transform: rotateY(900deg) rotateX(360deg) translateY(-100px); }
            75% { transform: rotateY(1350deg) rotateX(540deg) translateY(-50px); }
            100% { transform: rotateY(1800deg) rotateX(720deg); }
        }

        .coin.heads-result {
            transform: rotateY(0deg);
        }

        .coin.tails-result {
            transform: rotateY(180deg);
        }

        @media (max-width: 768px) {
            .coin-flip-container {
                padding: 1rem;
            }
            
            .coin {
                width: 120px;
                height: 120px;
            }
            
            .coin-text {
                font-size: 1rem;
            }
            
            .flip-button {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
            
            .stats {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="coin-flip-container">
        <h1>Coin Flip Test</h1>
        <div class="coin-wrapper">
            <div class="coin" id="coin">
                <div class="coin-side heads">
                    <div class="coin-text">HEADS</div>
                </div>
                <div class="coin-side tails">
                    <div class="coin-text">TAILS</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="flipBtn" class="flip-button">
                <span class="button-text">Flip Coin</span>
                <span class="button-icon">🪙</span>
            </button>
        </div>
        
        <div class="result" id="result">
            <p>Click the button to flip the coin!</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <span class="stat-label">Heads:</span>
                <span class="stat-value" id="headsCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Tails:</span>
                <span class="stat-value" id="tailsCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
        </div>
        
        <div class="reset-section">
            <button id="resetStatsBtn" class="reset-button">
                <span class="reset-icon">🔄</span>
                <span>Reset Statistics</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const coin = document.getElementById("coin");
            const flipBtn = document.getElementById("flipBtn");
            const result = document.getElementById("result");
            const headsCount = document.getElementById("headsCount");
            const tailsCount = document.getElementById("tailsCount");
            const totalCount = document.getElementById("totalCount");
            
            let stats = {
                heads: 0,
                tails: 0,
                total: 0
            };
            
            // Load stats from localStorage
            loadStats();
            
            // Flip button event listener
            flipBtn.addEventListener("click", flipCoin);
            
            // Coin click event listener for additional interactivity
            coin.addEventListener("click", () => {
                if (!flipBtn.disabled) {
                    flipCoin();
                }
            });
            
            function flipCoin() {
                console.log("Flipping coin...");
                
                // Disable button during animation
                flipBtn.disabled = true;
                flipBtn.querySelector('.button-text').textContent = "Flipping...";
                
                // Reset previous classes
                coin.classList.remove("heads-result", "tails-result", "flipping");
                result.classList.remove("heads", "tails");
                
                // Generate random result (true = heads, false = tails)
                const isHeads = Math.random() < 0.5;
                console.log("Result:", isHeads ? "HEADS" : "TAILS");
                
                // Add flipping animation
                coin.classList.add("flipping");
                
                // Show intermediate result
                result.innerHTML = `
                    <p style="color: var(--accent); font-weight: bold;">
                        🪙 Coin is in the air...
                    </p>
                `;
                
                // After animation completes
                setTimeout(() => {
                    console.log("Animation complete, applying result...");
                    
                    // Remove flipping class and add result class
                    coin.classList.remove("flipping");
                    coin.classList.add(isHeads ? "heads-result" : "tails-result");
                    
                    console.log("Applied classes:", coin.className);
                    
                    // Update result display
                    const resultText = isHeads ? "HEADS" : "TAILS";
                    const resultEmoji = isHeads ? "👑" : "🛡️";
                    const resultClass = isHeads ? "heads" : "tails";
                    
                    result.classList.add(resultClass);
                    result.innerHTML = `
                        <p>
                            ${resultEmoji} <strong>${resultText}</strong> ${resultEmoji}
                        </p>
                        <small>Click again to flip once more</small>
                    `;
                    
                    // Update statistics
                    updateStats(isHeads);
                    
                    // Re-enable button
                    flipBtn.disabled = false;
                    flipBtn.querySelector('.button-text').textContent = "Flip Again";
                    
                }, 2000); // Match animation duration
            }
            
            function updateStats(isHeads) {
                if (isHeads) {
                    stats.heads++;
                } else {
                    stats.tails++;
                }
                stats.total++;
                
                // Update display
                headsCount.textContent = stats.heads;
                tailsCount.textContent = stats.tails;
                totalCount.textContent = stats.total;
                
                // Save to localStorage
                saveStats();
                
                // Update percentages if total > 0
                if (stats.total > 0) {
                    const headsPercent = ((stats.heads / stats.total) * 100).toFixed(1);
                    const tailsPercent = ((stats.tails / stats.total) * 100).toFixed(1);
                    
                    headsCount.title = `${headsPercent}%`;
                    tailsCount.title = `${tailsPercent}%`;
                }
            }
            
            function loadStats() {
                try {
                    const savedStats = localStorage.getItem('coinFlipStatsTest');
                    if (savedStats) {
                        stats = JSON.parse(savedStats);
                        headsCount.textContent = stats.heads;
                        tailsCount.textContent = stats.tails;
                        totalCount.textContent = stats.total;
                    }
                } catch (error) {
                    console.log('Failed to load stats:', error);
                }
            }
            
            function saveStats() {
                try {
                    localStorage.setItem('coinFlipStatsTest', JSON.stringify(stats));
                } catch (error) {
                    console.log('Failed to save stats:', error);
                }
            }
            
            // Add reset button functionality
            const resetStatsBtn = document.getElementById('resetStatsBtn');
            if (resetStatsBtn) {
                resetStatsBtn.addEventListener('click', resetStats);
            }
            
            function resetStats() {
                if (confirm('Reset all flip statistics?')) {
                    stats = { heads: 0, tails: 0, total: 0 };
                    headsCount.textContent = '0';
                    tailsCount.textContent = '0';
                    totalCount.textContent = '0';
                    saveStats();
                    
                    // Show confirmation
                    result.innerHTML = `
                        <p style="color: var(--accent);">
                            📊 Statistics reset
                        </p>
                    `;
                    result.classList.remove("heads", "tails");
                }
            }
        });
    </script>
</body>
</html>
