{% assign lang = 'uk' %}
{% if page.url contains '/en/' %}
  {% assign lang = 'en' %}
{% endif %}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  {% include seo.html %}
  <!-- DNS prefetch for external domains -->
  <link rel="dns-prefetch" href="//www.google-analytics.com">
  <link rel="dns-prefetch" href="//googleads.g.doubleclick.net">
  <link rel="dns-prefetch" href="//pagead2.googlesyndication.com">
  
  <!-- Preload critical assets -->
  <link rel="preload" href="{{ '/assets/css/style.min.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="{{ '/assets/css/style.min.css' | relative_url }}"></noscript>
  
  <!-- Fallback for critical CSS if preload not supported -->
  <link rel="stylesheet" href="{{ '/assets/css/style.min.css' | relative_url }}">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include google-analytics.html %}
  {% include google-adsense.html %}
  {% include ahrefs-analytics.html %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  
  <!-- Defer JavaScript loading -->
  <script src="{{ '/assets/js/search-data.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/main.min.js' | relative_url }}" defer></script>
</body>
</html>
